name: Chat Digest

on:
  schedule:
    # Sunday & Wednesday 18:00 UTC — twice a week, each ahead of the matching
    # Cowork scheduled task (Monday/Thursday) that reads this digest, so
    # that run's messages are committed before the task runs.
    - cron: '0 18 * * 0,3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npx prisma generate
      - name: Check out the bug-digests branch into ./digest-branch
        # Digests live on their own branch so they never move main: no drift
        # in anyone's local clone, and no Vercel production build per digest.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin bug-digests >/dev/null 2>&1; then
            git worktree add -B bug-digests digest-branch origin/bug-digests
          else
            git worktree add --detach digest-branch
            cd digest-branch
            git checkout --orphan bug-digests
            git rm -rf . >/dev/null 2>&1 || true
          fi
      - name: Generate chat digest
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # Not a secret (just a channel ID), but kept here rather than
          # hardcoded in the script so it can be changed without a code edit.
          DISCORD_CHANNEL_ID: '1542985278833041471'
          DIGEST_DIR: digest-branch/reports
        run: npx tsx ./scripts/weekly-chat-digest.ts
      - name: Commit and push digest to bug-digests
        run: |
          cd digest-branch
          git add -A reports/
          if git diff --cached --quiet; then
            echo "No digest changes to commit"
          else
            git commit -m "chore: chat digest [skip ci]"
            git push origin bug-digests
          fi
