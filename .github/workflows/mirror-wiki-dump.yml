name: Mirror wiki dump

# Backup source for wiki data while battlecats.miraheze.org blocks our live
# requests. Pulls Miraheze's public XML dump from archive.org, keeps only the
# pages the sync needs, and commits them to the orphan `wiki-data` branch
# (same pattern as bug-digests: never moves main, never triggers a deploy).

on:
  # Monthly schedule (cron '0 3 5 * *') is OFF until a Miraheze dump of this
  # wiki is confirmed to exist on archive.org -- the 2026-11-17 test run found none.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund tsx
      - name: Install decompressors
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full zstd bzip2 >/dev/null
      - name: Check out the wiki-data branch into ./wiki-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin wiki-data >/dev/null 2>&1; then
            git worktree add -B wiki-data wiki-branch origin/wiki-data
          else
            git worktree add --detach wiki-branch
            cd wiki-branch
            git checkout --orphan wiki-data
            git rm -rf . >/dev/null 2>&1 || true
          fi
      - name: Mirror the dump
        env:
          OUT_DIR: wiki-branch/wiki-mirror
        run: npx tsx ./scripts/mirror-wiki-dump.ts
      - name: Commit and push to wiki-data
        run: |
          cd wiki-branch
          cat > vercel.json <<'JSON'
          {
            "git": { "deploymentEnabled": { "wiki-data": false } },
            "ignoreCommand": "exit 0"
          }
          JSON
          git add -A wiki-mirror vercel.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: mirror wiki dump [skip ci]"
            git push origin wiki-data
          fi
